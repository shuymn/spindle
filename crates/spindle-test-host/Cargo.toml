[package]
name = "spindle-test-host"
version = "0.1.0"
edition.workspace = true
description = "Config-driven stdio JSONL host for spindle integration tests."
license = "MIT"
repository = "https://github.com/shuymn/spindle"
publish = false

[lib]
name = "spindle_test_host"
path = "src/lib.rs"

[[bin]]
name = "spindle-test-host"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
spindle-extension-sdk = { workspace = true }

[lints]
workspace = true
